services:
  - type: web
    name: startpult-cloud-beta
    runtime: node
    region: frankfurt
    plan: free
    rootDir: cloud
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: startpult-beta-db
          property: connectionString
